  <style>text{font-family:Arial,sans-serif;fill:#15133b}.title{font-size:25px;font-weight:700}.label{font-size:17px;font-weight:700}.small{font-size:13px}.box{stroke:#6559d8;stroke-width:2;rx:18}.arrow{stroke:#7166dd;stroke-width:3;marker-end:url(#a)}</style>
