name: SkillForge CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python-quality:
    name: Python AI checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python service dependencies
        run: pip install -r python-service/requirements.txt
      - name: Run skill analyzer tests
        run: python python-service/test_skill_analyzer.py

  frontend-build:
    name: Frontend production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install
      - name: Build frontend
        working-directory: frontend
        run: npm run build

  gateway-check:
    name: API gateway checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install API gateway dependencies
        working-directory: backend/api-gateway
        run: npm install
      - name: Validate API gateway syntax
        run: node --check backend/api-gateway/server.js
      - name: Validate Compose configuration
        run: docker compose config --quiet

  auth-service-check:
    name: Auth service checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install auth service dependencies
        working-directory: backend/auth-service
        run: npm install
      - name: Validate auth service syntax
        run: node --check backend/auth-service/server.js

  docker-smoke-test:
    name: Full-stack Docker smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the stack
        run: docker compose up --build -d
      - name: Wait for service health endpoints
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:3000/api/health >/dev/null && \
               curl --fail --silent http://localhost:5000/api/health >/dev/null && \
               curl --fail --silent http://localhost:8080 >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Services did not become ready in time."
          exit 1
      - name: Verify protected API route
        run: |
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost:3000/api/profiles)
          test "$status" = "401"
      - name: Show service logs on failure
        if: failure()
        run: docker compose logs
      - name: Stop stack
        if: always()
        run: docker compose down -v
