version: '3.8'

services:
  api-gateway:
    build: 
      context: ./backend/api-gateway
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    networks:
      - skillforge-network

  python-service:
    build:
      context: ./python-service
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    networks:
      - skillforge-network

networks:
  skillforge-network:
    driver: bridge
