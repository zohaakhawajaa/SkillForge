apiVersion: v1
kind: Namespace
metadata:
  name: skillforge
---
apiVersion: v1
kind: Secret
metadata:
  name: skillforge-secrets
  namespace: skillforge
type: Opaque
stringData:
  JWT_SECRET: replace-before-deploying
  OPENAI_API_KEY: ""
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb
  namespace: skillforge
spec:
  replicas: 1
  selector:
    matchLabels: { app: mongodb }
  template:
    metadata:
      labels: { app: mongodb }
    spec:
      containers:
        - name: mongodb
          image: mongo:7
          ports: [{ containerPort: 27017 }]
          volumeMounts: [{ name: data, mountPath: /data/db }]
      volumes: [{ name: data, emptyDir: {} }]
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb
  namespace: skillforge
spec:
  selector: { app: mongodb }
  ports: [{ port: 27017, targetPort: 27017 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-service
  namespace: skillforge
spec:
  replicas: 1
  selector:
    matchLabels: { app: python-service }
  template:
    metadata:
      labels: { app: python-service }
    spec:
      containers:
        - name: python-service
          image: skillforge-python-service:latest
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 5000 }]
          env:
            - name: OPENAI_API_KEY
              valueFrom: { secretKeyRef: { name: skillforge-secrets, key: OPENAI_API_KEY } }
---
apiVersion: v1
kind: Service
metadata:
  name: python-service
  namespace: skillforge
spec:
  selector: { app: python-service }
  ports: [{ port: 5000, targetPort: 5000 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: skillforge
spec:
  replicas: 1
  selector:
    matchLabels: { app: api-gateway }
  template:
    metadata:
      labels: { app: api-gateway }
    spec:
      containers:
        - name: api-gateway
          image: skillforge-api-gateway:latest
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 3000 }]
          env:
            - name: NODE_ENV
              value: production
            - name: MONGODB_URI
              value: mongodb://mongodb:27017/skillforge
            - name: PYTHON_SERVICE_URL
              value: http://python-service:5000
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: skillforge-secrets, key: JWT_SECRET } }
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: skillforge
spec:
  selector: { app: api-gateway }
  ports: [{ port: 3000, targetPort: 3000 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: skillforge
spec:
  replicas: 1
  selector:
    matchLabels: { app: frontend }
  template:
    metadata:
      labels: { app: frontend }
    spec:
      containers:
        - name: frontend
          image: skillforge-frontend:latest
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 80 }]
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: skillforge
spec:
  type: LoadBalancer
  selector: { app: frontend }
  ports: [{ port: 80, targetPort: 80 }]
